[package]
name = "danma-runtime"
version = "0.1.0"
edition = "2021"
description = "Rust-native local data plane and shard placement primitives for DANMA"
license = "MIT"

[dependencies]
danma-core = { path = "../danma-core" }
danma-shard = { path = "../danma-shard" }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
