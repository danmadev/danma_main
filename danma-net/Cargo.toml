[package]
name = "danma-net"
version = "0.1.0"
edition = "2021"
description = "TCP transport and bounded discovery for DANMA CPU neurons"
license = "MIT"

[[bin]]
name = "danma-node"
path = "src/main.rs"

[dependencies]
danma-core = { path = "../danma-core" }
danma-shard = { path = "../danma-shard" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "time", "sync"] }
serde = { version = "1", features = ["derive"] }
# Native JSON integers retain the full u64 range. arbitrary_precision exposes
# some floats as private maps that Serde's internally tagged enum buffer rejects.
# Accurate f64 parsing also keeps valid f32 boundary literals inside their range.
serde_json = { version = "1", features = ["float_roundtrip"] }
