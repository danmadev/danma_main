name: DANMA MNIST benchmark harness

on:
  pull_request:
    paths:
      - "python/danma_torch/mnist_benchmark.py"
      - "python/tests/test_mnist_benchmark.py"
      - "python/MNIST_BENCHMARK.md"
      - ".github/workflows/danma-mnist.yml"
  workflow_dispatch:
    inputs:
      run_real_mnist_smoke:
        description: "Run a small real CPU + DANMA MNIST smoke benchmark"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  harness-unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install CPU PyTorch
        run: python -m pip install --index-url https://download.pytorch.org/whl/cpu "torch==2.8.0"
      - name: Verify benchmark syntax
        run: python -m compileall -q python/danma_torch/mnist_benchmark.py python/tests/test_mnist_benchmark.py
      - name: Run benchmark harness unit tests
        env:
          PYTHONPATH: python
        run: python -m unittest discover -s python/tests -p "test_mnist_benchmark.py" -v

  real-mnist-smoke:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_real_mnist_smoke }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install CPU PyTorch + torchvision
        run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu "torch==2.8.0" "torchvision==0.23.0"
      - name: Build optimized DANMA node
        run: cargo build --release --locked -p danma-net --bin danma-node
      - name: Run real MNIST CPU + DANMA smoke benchmark
        env:
          PYTHONPATH: python
        run: |
          python -m danma_torch.mnist_benchmark \
            --node-binary target/release/danma-node \
            --train-samples 100 \
            --test-samples 100 \
            --epochs 1 \
            --batch-size 8 \
            --backends cpu,danma \
            --json-out mnist-benchmark.json
      - uses: actions/upload-artifact@v4
        with:
          name: mnist-benchmark
          path: mnist-benchmark.json
