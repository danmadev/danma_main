name: DANMA PyTorch autograd adapter

on:
  push:
    branches: [main, feat/danma-pytorch-autograd-adapter, feat/danma-privateuse1-device]
    paths:
      - "python/**"
      - "danma-*/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/danma-pytorch.yml"
  pull_request:
    paths:
      - "python/**"
      - "danma-*/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/danma-pytorch.yml"

permissions:
  contents: read

jobs:
  pytorch-rust-cluster:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install CPU-only PyTorch and NumPy
        run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu "torch==2.8.0"
          python -m pip install "numpy==2.1.3"
      - name: Install editable DANMA PyTorch package with PrivateUse1 extension
        env:
          MAX_JOBS: "2"
        run: python -m pip install -e ./python --no-build-isolation --no-deps
      - name: Verify Python syntax
        run: python -m compileall -q python/danma_torch python/tests python/benchmark_tests
      - name: Build real DANMA TCP nodes
        run: cargo build --locked -p danma-net --bin danma-node
      - name: Verify CPU core, shards and TCP contracts
        run: cargo test --locked -p danma-core -p danma-shard -p danma-runtime -p danma-net --all-targets
      - name: Prove fail-closed DANMA PrivateUse1 before any autograd engine use
        env:
          DANMA_NODE_BIN: target/debug/danma-node
        run: python -m unittest discover -s python/tests -p "test_privateuse1.py" -v
      - name: Prove native DANMA tensor ops and ordinary nn.Linear training
        env:
          DANMA_NODE_BIN: target/debug/danma-node
        run: python -m unittest discover -s python/tests -p "test_native_ops.py" -v
      - name: Run CPU-tensor PyTorch autograd integration tests
        env:
          DANMA_NODE_BIN: target/debug/danma-node
        run: python -m unittest discover -s python/tests -p "test_autograd.py" -v
      - name: Run multi-epoch convergence benchmark
        env:
          DANMA_NODE_BIN: target/debug/danma-node
        run: python -m unittest discover -s python/tests -p "test_training_convergence.py" -v
      - name: Run single-node variable-width MNIST harness tests
        if: ${{ always() }}
        env:
          DANMA_NODE_BIN: target/debug/danma-node
        run: python -m unittest discover -s python/benchmark_tests -p "test_mnist_single_node.py" -v
      - name: Run async shard MNIST parity smoke
        if: ${{ always() }}
        env:
          DANMA_NODE_BIN: target/debug/danma-node
        run: python -m unittest discover -s python/benchmark_tests -p "test_mnist_shard.py" -v
      - name: Run three-node Rust shard MNIST CPU parity smoke
        if: ${{ always() }}
        env:
          DANMA_NODE_BIN: target/debug/danma-node
        run: python -m unittest discover -s python/benchmark_tests -p "test_mnist_rust_3node.py" -v
      - name: Verify configurable multi-node profiling metrics
        if: ${{ always() }}
        env:
          DANMA_NODE_BIN: target/debug/danma-node
        run: python -m unittest discover -s python/benchmark_tests -p "test_mnist_rust_multinode.py" -v
